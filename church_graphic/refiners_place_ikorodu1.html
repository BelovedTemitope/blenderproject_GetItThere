<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@500;700&display=block" rel="stylesheet">
<style>
:root{
  --navy:#06173f; --royal:#0f3b8c; --sky:#3d7ad6;
  --gold:#f2b632; --gold-lite:#ffe08a; --amber:#e8741c; --crimson:#b3141d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 60% 55% at 50% 48%, rgba(61,122,214,.55), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, var(--royal), var(--navy) 75%);
  font-family:'Cinzel',serif; color:#fff;
  display:flex;align-items:center;justify-content:center;position:relative;
}
/* soft light rays */
body::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg at 50% 46%, rgba(255,224,138,.05) 0 4deg, transparent 4deg 12deg);
  -webkit-mask:radial-gradient(circle at 50% 46%, #000 0 30%, transparent 65%);
          mask:radial-gradient(circle at 50% 46%, #000 0 30%, transparent 65%);}
/* gold frame */
.frame{position:absolute;inset:42px;border:3px solid var(--gold);border-radius:6px;opacity:.85}
.frame::after{content:"";position:absolute;inset:12px;border:1px solid rgba(242,182,50,.45);border-radius:3px}
/* fire glow at base */
.ember{position:absolute;left:0;right:0;bottom:0;height:260px;
  background:radial-gradient(ellipse 55% 100% at 50% 100%, rgba(232,116,28,.55), rgba(179,20,29,.25) 45%, transparent 75%)}
.wrap{position:relative;text-align:center;z-index:2}
.the{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.6em;font-size:40px;color:var(--gold-lite);margin-bottom:6px;padding-left:.6em}
h1{font-weight:900;font-size:168px;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,var(--gold-lite) 0%,var(--gold) 45%,var(--amber) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.25)) drop-shadow(0 0 40px rgba(242,182,50,.35));}
.min{font-weight:800;font-size:84px;letter-spacing:.32em;color:#fff;margin-top:14px;padding-left:.32em;
  text-shadow:0 4px 18px rgba(0,0,0,.4)}
.rule{display:flex;align-items:center;justify-content:center;gap:26px;margin:44px auto 40px}
.rule span{height:3px;width:420px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.rule i{width:20px;height:20px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 18px var(--amber)}
.branch{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:62px;letter-spacing:.28em;
  padding:22px 70px 22px calc(70px + .28em);color:#fff;
  background:linear-gradient(90deg,var(--crimson),#d8381e 50%,var(--crimson));
  border:3px solid var(--gold);border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 6px rgba(255,224,138,.15)}
</style></head>
<body>
  <div class="ember"></div>
  <div class="frame"></div>
  <div class="wrap">
    <div class="the">THE</div>
    <h1>REFINER'S PLACE</h1>
    <div class="min">MINISTRIES</div>
    <div class="rule"><span></span><i></i><span></span></div>
    <div class="branch">IKORODU 1 BRANCH</div>
  </div>
</body></html>
